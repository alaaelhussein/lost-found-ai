services:
  app:
    build:
      context: .
    ports:
      # 127.0.0.1 : accessible depuis ce PC uniquement, pas depuis le réseau local
      - "127.0.0.1:8000:80"
    volumes:
      - .:/var/www/html
    environment:
      # Développement uniquement : erreurs détaillées et livraison simulée.
      # Ce fichier ne sert PAS en production (voir DEPLOIEMENT.md).
      APP_URL: http://localhost:8000
      APP_DEBUG: "1"
      DELIVERY_ENABLED: "1"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: lost_found_ai
      DB_USER: lost_found
      DB_PASSWORD: lost_found_password
      # Emails envoyés à Mailpit (service ci-dessous) : rien ne part sur Internet
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@lostfound.local
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Boîte mail de test : capture TOUS les emails envoyés par l'application.
  # Interface web pour les lire : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.20.0
    ports:
      - "127.0.0.1:8025:8025"

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: lost_found_ai
      MARIADB_USER: lost_found
      MARIADB_PASSWORD: lost_found_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      # Sans 127.0.0.1, la base (et son mot de passe de développement) serait
      # joignable par n'importe qui sur le même wifi.
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
